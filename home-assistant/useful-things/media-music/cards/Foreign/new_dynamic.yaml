  - type: custom:service-call
    entries:
      - type: dropdown
        entity_id: input_select.classical_set
        options: []
        icon: mdi:account-music
        option_type: attribute
        option_entity: input_select.classical_set
        option_attribute: options
        option_template:
          entity_id: input_select.classical_set
          label: "{{ option }}"
          tap_action:
            action: perform-action
            perform_action: script.play_artist
            data:
              option: "{{ option }}"
              media_player: media_player.kitchen
            target:
              entity_id: "{{ config.entity }}"
        value_attribute: state