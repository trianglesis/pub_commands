type: custom:custom-features-card
features:
  - type: custom:service-call
    entries:
      - type: button
        entity_id: ""
        label: Виконавці Зарубіжні
        icon: mdi:countertop
        thumb: transparent
  - type: custom:service-call
    entries:
      - type: dropdown
        entity_id: input_select.foreign_electro_set
        options: []
        icon: mdi:account-music
        option_type: attribute
        option_entity: input_select.foreign_electro_set
        option_attribute: options
        option_template:
          entity_id: input_select.foreign_electro_set
          label: "{{ option }}"
          tap_action:
            action: perform-action
            perform_action: script.play_artist
            data:
              option: "{{ option }}"
              media_player: media_player.bathroom
            target:
              entity_id: "{{ config.entity }}"
        value_attribute: state
  - type: custom:service-call
    entries:
      - type: dropdown
        entity_id: input_select.foreign_heavy_set
